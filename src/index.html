<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'" />
<title>InkStone</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="titlebar">
  <div class="tb-brand">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M1.6 9.4h12.8v1.5a3.2 3.2 0 0 1-3.2 3.2H4.8a3.2 3.2 0 0 1-3.2-3.2z" fill="currentColor"/>
      <path d="M8 8.6V6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
      <path d="M10.2 1.4 13 4.2 9.6 7.6 6.8 4.8z" fill="currentColor"/>
    </svg>
    <span>InkStone</span>
  </div>
  <div class="tb-title" id="tbTitle"></div>
  <div class="tb-spacer"></div>
</div>

<div id="main">

  <aside id="sidebar">
    <div class="side-head">
      <span class="side-title">Workspaces</span>
      <div class="side-actions">
        <button class="ibtn" id="btnNewFolder" title="New folder">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M1.5 4.2a1 1 0 0 1 1-1h3.1l1.2 1.4h6.7a1 1 0 0 1 1 1v6.6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 7v4M6 9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="ibtn" id="btnNewWorkspace" title="New workspace">
          <svg width="15" height="15" viewBox="0 0 16 16"><rect x="2.3" y="2.3" width="11.4" height="11.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.4v5.2M5.4 8h5.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="side-search">
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search" spellcheck="false" />
    </div>

    <div id="tree" tabindex="0"></div>

    <div class="side-foot">
      <button class="linkbtn" id="btnRevealData" title="Open the folder your notes are stored in">Storage folder</button>
      <span class="dot">·</span>
      <button class="linkbtn" id="btnHelp" title="Keyboard shortcuts">Shortcuts</button>
    </div>
    <div id="sideResizer"></div>
  </aside>

  <section id="stage">

    <div id="toolbar" role="toolbar" aria-label="Tools"></div>

    <div id="props" class="hidden"></div>

    <div id="viewport">
      <canvas id="canvas"></canvas>
      <div id="domlayer"></div>
      <canvas id="overlay"></canvas>
      <div id="emptyState" class="hidden">
        <div class="empty-inner">
          <h2>No workspace open</h2>
          <p>Create one in the sidebar, or press <kbd>Ctrl</kbd>+<kbd>N</kbd>.</p>
        </div>
      </div>
    </div>

    <div id="statusbar">
      <button class="sb-btn" id="btnZoomOut" title="Zoom out (Ctrl+-)">&minus;</button>
      <button class="sb-btn wide" id="btnZoomLevel" title="Reset zoom to 100% (Ctrl+0)">100%</button>
      <button class="sb-btn" id="btnZoomIn" title="Zoom in (Ctrl++)">+</button>
      <span class="sb-sep"></span>
      <button class="sb-btn wide" id="btnFit" title="Fit all content (Shift+1)">Fit</button>
      <button class="sb-btn wide" id="btnHome" title="Go to origin (Home)">Center</button>
      <span class="sb-sep"></span>
      <button class="sb-btn wide" id="btnPaper" title="Background for this workspace">Paper</button>
      <button class="sb-btn wide" id="btnExport" title="Export this workspace as a PNG">Export PNG</button>
      <span class="sb-flex"></span>
      <span class="sb-info" id="saveState"></span>
    </div>

  </section>
</div>

<div id="ctxmenu" class="hidden"></div>

<div id="modalBack" class="hidden">
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="hidden"></div>

<script src="util.js"></script>
<script src="store.js"></script>
<script src="tree.js"></script>
<script src="workspace.js"></script>
<script src="render.js"></script>
<script src="elements.js"></script>
<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
